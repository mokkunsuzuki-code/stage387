name: Stage380 Independent Verification Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".stage380-development-policy.json"
      - "development/stage379/**"
      - "development/stage380/**"
      - "docs/timestamp-finalization/stage377_dual_timestamp_finalization_result.json"
      - "docs/qkd/stage378_qkd_safety_metadata_binding_result.json"
      - ".github/workflows/stage380-independent-verification.yml"
  pull_request:
    paths:
      - ".stage380-development-policy.json"
      - "development/stage379/**"
      - "development/stage380/**"
      - "docs/timestamp-finalization/stage377_dual_timestamp_finalization_result.json"
      - "docs/qkd/stage378_qkd_safety_metadata_binding_result.json"
      - ".github/workflows/stage380-independent-verification.yml"

permissions:
  contents: read

jobs:
  stage380-independent-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: |
          set -euo pipefail

          python3 -m py_compile \
            development/stage380/verify_stage380_independent_package.py

      - name: Validate Stage380 JSON inputs
        run: |
          set -euo pipefail

          python3 -m json.tool \
            .stage380-development-policy.json \
            >/dev/null

          python3 -m json.tool \
            development/stage380/stage380_independent_verification_package_contract.json \
            >/dev/null

          python3 -m json.tool \
            development/stage380/stage380_independent_verification_manifest.json \
            >/dev/null

          python3 -m json.tool \
            development/stage380/stage380_independent_verification_certificate.json \
            >/dev/null

      - name: Verify retained SHA256 records
        run: |
          set -euo pipefail

          shasum -a 256 -c \
            development/stage380/stage380_independent_verification_package_contract.sha256

          shasum -a 256 -c \
            development/stage380/stage380_independent_verification_manifest.sha256

          shasum -a 256 -c \
            development/stage380/stage380_independent_verification_certificate.sha256

      - name: Run deterministic offline verifier
        run: |
          set -euo pipefail

          python3 \
            development/stage380/verify_stage380_independent_package.py

      - name: Validate deterministic verification result
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path(
              "development/stage380/"
              "stage380_independent_verification_result.json"
          )

          if not path.is_file():
              raise SystemExit("Stage380 result file is missing.")

          result = json.loads(path.read_text(encoding="utf-8"))

          required_fields = [
              "stage",
              "verifier",
              "execution_mode",
              "verification_mode",
              "network_access_required",
              "fail_closed",
              "package_integrity_verified",
              "formal_independent_verification",
              "formal_acceptance",
              "pipeline_completed",
              "public_release_allowed",
              "verification_status",
              "decision",
              "critical_failure_count",
              "critical_failures",
              "checks",
              "errors",
              "result_sha256",
          ]

          missing = [
              field for field in required_fields
              if field not in result
          ]

          if missing:
              raise SystemExit(
                  f"Missing Stage380 result fields: {missing}"
              )

          if result["stage"] != 380:
              raise SystemExit("Stage number is not 380.")

          if result["verification_mode"] != "deterministic_offline":
              raise SystemExit(
                  "Stage380 verification mode is not deterministic_offline."
              )

          if result["network_access_required"] is not False:
              raise SystemExit(
                  "Stage380 result unexpectedly requires network access."
              )

          if result["fail_closed"] is not True:
              raise SystemExit("Stage380 fail-closed policy is disabled.")

          if result["package_integrity_verified"] is not True:
              raise SystemExit(
                  "Stage380 package integrity was not verified."
              )

          if result["public_release_allowed"] is not False:
              raise SystemExit(
                  "Stage380 public release must remain disabled."
              )

          allowed_decisions = {
              "development_package_verified_upstream_pending",
              "independent_verification_package_ready",
          }

          if result["decision"] not in allowed_decisions:
              raise SystemExit(
                  f"Unexpected Stage380 decision: {result['decision']}"
              )

          if result["critical_failure_count"] != 0:
              raise SystemExit(
                  "Stage380 result contains critical failures."
              )

          expected_hash = result["result_sha256"]

          unsigned = dict(result)
          unsigned.pop("result_sha256", None)

          actual_hash = hashlib.sha256(
              json.dumps(
                  unsigned,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              ).encode("utf-8")
          ).hexdigest()

          if actual_hash != expected_hash:
              raise SystemExit(
                  "Stage380 internal result SHA256 mismatch: "
                  f"expected={expected_hash} actual={actual_hash}"
              )

          print(f"decision={result['decision']}")
          print("package_integrity_verified=true")
          print("critical_failure_count=0")
          print("result_sha256_verified=true")
          PY

      - name: Verify deterministic output
        run: |
          set -euo pipefail

          RESULT_PATH="development/stage380/stage380_independent_verification_result.json"

          FIRST_HASH="$(
            shasum -a 256 "${RESULT_PATH}" | awk '{print $1}'
          )"

          python3 \
            development/stage380/verify_stage380_independent_package.py \
            >/dev/null

          SECOND_HASH="$(
            shasum -a 256 "${RESULT_PATH}" | awk '{print $1}'
          )"

          echo "first_hash=${FIRST_HASH}"
          echo "second_hash=${SECOND_HASH}"

          test "${FIRST_HASH}" = "${SECOND_HASH}"

          echo "deterministic_output_verified=true"

      - name: Verify stored result SHA256 record
        run: |
          set -euo pipefail

          shasum -a 256 -c \
            development/stage380/stage380_independent_verification_result.sha256

      - name: Scan public tree for forbidden files
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          docs = Path("docs")

          allowed_public_pem = Path(
              "docs/mldsa-production/"
              "stage375_mldsa65_public_key.pem"
          )

          allowed_public_pem_sha256 = (
              "1416f7cf4b7b755e86de50d56a63acb9d3b4cb2ce970253bccce45c26b358d19"
          )

          forbidden_suffixes = {
              ".key",
              ".p12",
              ".pfx",
              ".seed",
              ".pk8",
              ".ots",
              ".tsq",
              ".tsr",
              ".tst",
              ".qkdkey",
              ".rawkey",
              ".siftedkey",
              ".reconciledkey",
              ".finalkey",
          }

          forbidden_qkd_prefixes = (
              "qkd_raw_key",
              "qkd_secret_key",
              "qkd_sifted_key",
              "qkd_reconciled_key",
              "qkd_final_key",
          )

          private_key_markers = (
              b"-----BEGIN PRIVATE KEY-----",
              b"-----BEGIN ENCRYPTED PRIVATE KEY-----",
              b"-----BEGIN RSA PRIVATE KEY-----",
              b"-----BEGIN EC PRIVATE KEY-----",
              b"-----BEGIN OPENSSH PRIVATE KEY-----",
          )

          failures = []
          pem_count = 0

          for candidate in docs.rglob("*"):
              if not candidate.is_file():
                  continue

              raw = candidate.read_bytes()
              lower_name = candidate.name.lower()

              if any(
                  marker in raw
                  for marker in private_key_markers
              ):
                  failures.append(
                      candidate.as_posix()
                      + ":private-key-marker"
                  )

              if (
                  candidate.suffix.lower()
                  in forbidden_suffixes
              ):
                  failures.append(
                      candidate.as_posix()
                      + ":forbidden-suffix"
                  )

              if lower_name.startswith(
                  forbidden_qkd_prefixes
              ):
                  failures.append(
                      candidate.as_posix()
                      + ":forbidden-qkd-key-name"
                  )

              if candidate.suffix.lower() == ".pem":
                  pem_count += 1

                  if candidate != allowed_public_pem:
                      failures.append(
                          candidate.as_posix()
                          + ":unlisted-pem"
                      )
                      continue

                  actual_sha = hashlib.sha256(
                      raw
                  ).hexdigest()

                  if (
                      actual_sha
                      != allowed_public_pem_sha256
                  ):
                      failures.append(
                          candidate.as_posix()
                          + ":allowed-public-pem-hash-mismatch"
                      )

                  if not raw.startswith(
                      b"-----BEGIN PUBLIC KEY-----"
                  ):
                      failures.append(
                          candidate.as_posix()
                          + ":allowed-public-pem-header-mismatch"
                      )

          print(
              "public_pem_count="
              + str(pem_count)
          )

          print(
              "public_forbidden_file_count="
              + str(len(failures))
          )

          for failure in failures:
              print(
                  "PUBLIC_FORBIDDEN="
                  + failure
              )

          assert not failures
          assert pem_count == 1

          print(
              "allowed_public_mldsa65_key_sha256="
              + allowed_public_pem_sha256
          )

          print(
              "public_tree_security_scan_verified=true"
          )
          PY

      - name: Upload Stage380 verification package
        uses: actions/upload-artifact@v4
        with:
          name: stage380-independent-verification-package
          path: |
            .stage380-development-policy.json
            development/stage380/stage380_independent_verification_package_contract.json
            development/stage380/stage380_independent_verification_package_contract.sha256
            development/stage380/verify_stage380_independent_package.py
            development/stage380/stage380_independent_verification_result.json
            development/stage380/stage380_independent_verification_result.sha256
            development/stage380/stage380_independent_verification_manifest.json
            development/stage380/stage380_independent_verification_manifest.sha256
            development/stage380/stage380_independent_verification_certificate.json
            development/stage380/stage380_independent_verification_certificate.sha256
          if-no-files-found: error
          include-hidden-files: true
